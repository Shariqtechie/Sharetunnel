<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareTunnel</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#272b35; --text:#e8eaf0; --dim:#8b92a3; --accent:#4f8cff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f0556a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; display:flex; align-items:center; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.bad { background:var(--bad); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input { width:100%; background:#0f1115; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px; font:inherit; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:13px; background:#0f1115; border:1px solid var(--line); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .running .dot { background:var(--ok); } .starting .dot { background:var(--warn); } .error .dot { background:var(--bad); }
  .url { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; word-break:break-all; color:var(--accent); }
  .dim { color:var(--dim); font-size:13px; }
  .share { display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .share:first-child { border-top:0; }
  .icon { font-size:24px; }
  .name { word-break:break-word; }
  pre { margin:0; max-height:220px; overflow:auto; font-size:12px; color:var(--dim); white-space:pre-wrap; }
  .err { color:var(--bad); font-size:13px; margin-top:8px; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--dim); font-weight:600; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌐 ShareTunnel <span class="dim" id="ver"></span></h1>

  <div id="login" class="card hidden">
    <h2>Log in</h2>
    <div class="row">
      <div class="grow"><input id="pw" type="password" placeholder="Panel password" autocomplete="current-password"></div>
      <button id="loginBtn">Log in</button>
    </div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span class="pill" id="pill"><span class="dot"></span><span id="statusText">…</span></span>
        <div class="row">
          <button id="toggle">…</button>
          <button class="ghost" id="logout">Log out</button>
        </div>
      </div>
      <div style="margin-top:14px" id="urlBox">
        <div class="dim">Public address</div>
        <div class="row" style="margin-top:4px">
          <div class="url grow" id="url">none</div>
          <button id="copyUrl" disabled>Copy</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Shared from Nextcloud</h2>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <div id="shares" style="margin-top:8px"><div class="dim">Loading…</div></div>
      <div class="err" id="shareErr"></div>
    </div>

    <div class="card">
      <h2>Log</h2>
      <pre id="logs"></pre>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let state = { url:"", status:"" }, lastShareUrl = null, tick = 0;

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST",
    headers: {"Content-Type":"application/json"}, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("login"); }
  return r.json();
}

function showLogin() { $("#login").classList.remove("hidden"); $("#main").classList.add("hidden"); }
function showMain()  { $("#login").classList.add("hidden"); $("#main").classList.remove("hidden"); }

function copy(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = o, 1500); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); return; }
  const t = document.createElement("textarea");   // fallback: this panel runs on plain http
  t.value = text; t.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch (e) { prompt("Copy this link:", text); }
  t.remove();
}

function renderStatus(s) {
  state = s;
  $("#ver").textContent = s.version;
  $("#pill").className = "pill " + s.status;
  $("#statusText").textContent = { running:"Online", starting:"Starting…", stopped:"Stopped", error:"Error" }[s.status] || s.status;
  $("#url").textContent = s.url || "none";
  $("#copyUrl").disabled = !s.url;
  const on = s.status !== "stopped";
  const b = $("#toggle");
  b.textContent = on ? "Stop" : "Start";
  b.className = on ? "bad" : "";
  const pre = $("#logs"), atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  pre.textContent = s.logs.join("\n");
  if (atBottom) pre.scrollTop = pre.scrollHeight;
}

async function loadShares() {
  const d = await api("/api/shares");
  $("#shareErr").textContent = d.error ? "Could not read shares: " + d.error : "";
  const box = $("#shares"); box.textContent = "";
  if (!d.shares.length) { box.innerHTML = '<div class="dim">No public share links yet. Create one in Nextcloud and it shows up here.</div>'; return; }
  for (const s of d.shares) {
    const row = document.createElement("div"); row.className = "share";
    const ic = document.createElement("div"); ic.className = "icon"; ic.textContent = s.icon;
    const mid = document.createElement("div"); mid.className = "grow";
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = s.file_target.replace(/^\//, "");
    const meta = document.createElement("div"); meta.className = "dim";
    let m = s.kind + " · " + s.size_text + " · " + s.owner;
    if (s.has_pw) m += " · 🔒 password";
    if (s.expiration) m += " · ⏳ expires " + s.expiration;
    meta.textContent = m;
    mid.append(nm, meta);
    const btn = document.createElement("button"); btn.textContent = "Copy link";
    btn.disabled = !state.url;
    btn.onclick = () => copy(state.url + "/s/" + s.token, btn);
    row.append(ic, mid, btn); box.append(row);
  }
}

async function poll() {
  try {
    renderStatus(await api("/api/status"));
    if (state.url !== lastShareUrl || tick % 7 === 0) { lastShareUrl = state.url; loadShares(); }
    tick++;
  } catch (e) {}
}

$("#loginBtn").onclick = async () => {
  const r = await api("/api/login", { password: $("#pw").value });
  if (r.ok) { $("#loginErr").textContent = ""; $("#pw").value = ""; showMain(); poll(); }
  else $("#loginErr").textContent = r.error || "Login failed";
};
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logout").onclick = async () => { await api("/api/logout", {}); showLogin(); };
$("#copyUrl").onclick = e => copy(state.url, e.target);
$("#refresh").onclick = loadShares;
$("#toggle").onclick = async e => {
  e.target.disabled = true;
  await api(state.status === "stopped" ? "/api/start" : "/api/stop", {});
  e.target.disabled = false; poll();
};

(async () => {
  try { renderStatus(await api("/api/status")); showMain(); poll(); } catch (e) {}
  setInterval(() => { if (!$("#main").classList.contains("hidden")) poll(); }, 3000);
})();
</script>
</body>
</html>
