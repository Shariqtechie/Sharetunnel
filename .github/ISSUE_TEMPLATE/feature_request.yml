name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: "Describe the situation, not only the solution."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
