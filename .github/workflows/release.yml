name: build-and-publish

on:
  push:
    branches: [main]      # every push builds the :edge test image
    tags: ["v*"]          # pushing a tag like v0.1.0 publishes a release
  workflow_dispatch:      # Actions tab -> Run workflow -> type a version
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (leave empty to only build :edge)"
        required: false

permissions:
  contents: write   # create GitHub Releases
  packages: write   # push to ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          else v="edge"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$v" = "edge" ]; then echo "release=false" >> "$GITHUB_OUTPUT"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/shariqtechie/sharetunnel:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.release == 'true' && 'ghcr.io/shariqtechie/sharetunnel:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Release notes come from CHANGELOG.md, so the panel's "Release notes" card shows them too.
      - name: Extract release notes
        if: steps.ver.outputs.release == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $V" > release-notes.md

      # Runs LAST, so the release only appears after its image is ready to pull.
      - name: Create GitHub Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
